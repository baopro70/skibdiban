<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Sokoban - 12A2 Tin Học</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>SOKOBAN</h1>
        <p class="subtitle">Dự án Tin học 12A2</p>

        <!-- Thanh chọn Màn chơi -->
        <div style="margin-bottom: 12px; display: flex; gap: 8px; justify-content: center; align-items: center;">
            <label style="color: white; font-weight: bold; font-size: 14px;">Chọn màn:</label>
            <select id="levelSelect" onchange="changeLevel(this.value)" style="padding: 6px 12px; border-radius: 6px; font-size: 14px; background: #fff; border: none; cursor: pointer; font-weight: bold;">
                <option value="0">Màn 1 (Dễ)</option>
                <option value="1">Màn 2 (Vừa)</option>
                <option value="2">Màn 3 (Thử thách)</option>
            </select>
        </div>

        <!-- Khung hiển thị bàn chơi -->
        <div id="board"></div>

        <!-- Các nút bấm dành cho điện thoại -->
        <div class="mobile-controls">
            <div class="row">
                <button onclick="handleMove(0, -1)">⬆️</button>
            </div>
            <div class="row">
                <button onclick="handleMove(-1, 0)">⬅️</button>
                <button onclick="resetLevel()" class="btn-reset">🔄</button>
                <button onclick="handleMove(1, 0)">➡️</button>
            </div>
            <div class="row">
                <button onclick="handleMove(0, 1)">⬇️</button>
            </div>
        </div>

        <div class="desktop-controls">
            <button onclick="resetLevel()" class="btn-reset">Chơi lại màn này</button>
        </div>
    </div>

    <!-- Hệ thống Hiệu ứng Âm thanh (SFX) -->
    <audio id="sfx-step" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>
    <audio id="sfx-push" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>
    <audio id="sfx-win" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
