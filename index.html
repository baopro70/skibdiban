<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sokoban Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Sokoban</h1>
        <div class="controls-bar" style="margin-bottom: 15px; display: flex; gap: 10px; justify-content: center;">
            <select id="levelSelect" onchange="changeLevel(this.value)">
                <option value="0">Tutorial (Tutorial)</option>
                <option value="1">Màn 1: Level em bé </option>
                <option value="2">Màn 2: Level lớp 5 </option>
                <option value="3">Màn 3: Level Tuấn Anh </option>
            </select>
            <button onclick="restartLevel()">Chơi lại</button>
            <button onclick="undoMove()">Đi lại </button>
        </div>

        <div id="board" class="board"></div>

        <div class="mobile-controls">
            <button class="btn-up" onclick="handleMove(-1, 0)">▲</button>
            <div class="horizontal">
                <button onclick="handleMove(0, -1)">◄</button>
                <button onclick="undoMove()">↩</button>
                <button onclick="handleMove(0, 1)">►</button>
            </div>
            <button class="btn-down" onclick="handleMove(1, 0)">▼</button>
        </div>
    </div>

    <div id="winModal" class="win-modal hidden" aria-hidden="true">
        <div class="win-card">
            <div class="trophy">🏆</div>
            <h2 id="winTitle">Chúc mừng chiến thắng!</h2>
            <p id="winText">Bạn đã hoàn thành màn chơi.</p>
            <button id="nextLevelBtn">Tiếp tục</button>
        </div>
    </div>

    <audio id="sfx-step" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>
    <audio id="sfx-push" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>
    <audio id="sfx-win" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
